<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Change Password</title>
        <!-- Bootstrap CSS CDN -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body>
        <section class="vh-100 d-flex flex-column justify-content-center align-items-center" style="background-color: #5ca9f5ff;">
            <div class="container py-5 h-100">
                <div class="row d-flex justify-content-center align-items-center h-100">
                    <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                        <div class="card shadow-2-strong" style="border-radius: 1rem; background-color: #ecece4ff;">
                            <div class="card-body p-5 text-center">
                                <h3 class="mb-1">Change Password</h3>
                                <h4 class="fw-lighter">User : {{ request.user.username }}</h4>
                                <div class="d-flex justify-content-center align-items-center mt-4">
                                    <form method="post" class="w-100" style="max-width: 320px;">
                                    {% csrf_token %}
                                        <input type="password" name="current_password" class="form-control mb-2" placeholder="Current Password" required>
                                        <input type="password" name="new_password" class="form-control mb-2" placeholder="New Password" required>
                                        <input type="password" name="confirm_password" class="form-control mb-3" placeholder="Confirm New Password" required>
                                        <button type="submit" class="btn btn-primary w-100 mb-2">Change Password</button>
                                        <a href="{% url 'home' %}" class="btn btn-secondary w-100">Cancel</a>
                                        {% if messages %}
                                            {% for message in messages %}
                                                <div class="alert alert-danger mt-3" role="alert">
                                                {{ message }}
                                                </div>
                                            {% endfor %}
                                        {% endif %}
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- Bootstrap JS Bundle CDN (optional, for interactive components) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>

</html>
