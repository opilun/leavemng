<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <!-- Bootstrap CSS CDN -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body>
        <div class="container text-center mt-4">
            <h1>Welcome to the Leave Management System</h1>
            <!-- <p>Please <a href="{% url 'login' %}">log in</a> to access your dashboard.</p> -->
            <p class="fw-lighter">Please log in to access your dashboard.</p>

        </div>
        <div class="d-flex justify-content-center align-items-center mt-4">
            <form method="post" class="w-100" style="max-width: 320px;">
                {% csrf_token %}

                <input type="text" name="username" class="form-control mb-2" placeholder="Username" required>
                <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>
                <button type="submit" class="btn btn-primary w-100">Log in</button>
                {% if messages %}
                {% for message in messages %}
                <div class="alert alert-danger mt-3" role="alert">
                    {{ message }}
                </div>
                {% endfor %}
                {% endif %}
            </form>
        </div>
        <!-- Bootstrap JS Bundle CDN (optional, for interactive components) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>

</html>
