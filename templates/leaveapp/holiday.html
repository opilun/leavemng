{% extends 'leaveapp/layout.html' %}
{% block content %}
<div class="container pt-5 pb-5">

    <h1 class="mb-4">Public Holidays</h1>
    <table class="table table-bordered table-striped">
        <thead class="table-primary">
            <tr>
                <th>Name</th>
                <th>Date</th>

            </tr>
        </thead>
        <tbody>
            {% for holiday in holidays %}
            <tr>
                <td>{{ holiday.name }}</td>
                <td>{{ holiday.date|date:"d M Y" }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="text-center">No holidays found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
